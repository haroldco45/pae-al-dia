name: Robot PAE al Día

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: robot-pae
  cancel-in-progress: false

jobs:
  noticias:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Traer noticias y videos reales
        run: node scripts/robot.mjs
      - name: Guardar si hay cambios
        run: |
          git config user.name "robot-pae-al-dia"
          git config user.email "robot@users.noreply.github.com"
          git add data/noticias.json
          if git diff --cached --quiet; then
            echo "Sin noticias nuevas"
          else
            git commit -m "Robot: noticias del PAE $(TZ=America/Bogota date '+%Y-%m-%d %H:%M') hora Colombia"
            git pull --rebase
            git push
          fi
